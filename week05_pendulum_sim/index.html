<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆混沌模拟器 — Week05</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a24; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font: 13px/1.7 Consolas, "Courier New", monospace;
    color: #8fd3ff; text-shadow: 0 0 6px rgba(80,180,255,.45);
    pointer-events: none; user-select: none; white-space: pre;
  }
  #panel {
    position: fixed; bottom: 18px; left: 16px;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 16px; border: 1px solid #2e3a55; border-radius: 10px;
    background: rgba(26,26,36,0.85);
    box-shadow: 0 0 18px rgba(60,120,200,.18), inset 0 0 24px rgba(60,120,200,.06);
    font: 13px Consolas, "Courier New", monospace; color: #8fd3ff;
    user-select: none;
  }
  #panel .tip { color: #6f86b8; }
  #resetBtn {
    padding: 6px 0; border: 1px solid #3d5578; border-radius: 6px;
    background: rgba(90,184,255,0.12); color: #8fd3ff; cursor: pointer;
    font: 13px Consolas, "Courier New", monospace; letter-spacing: 2px;
    transition: background .15s, box-shadow .15s;
  }
  #resetBtn:hover { background: rgba(90,184,255,0.28); box-shadow: 0 0 10px rgba(90,184,255,.35); }
  #resetBtn:active { background: rgba(90,184,255,0.4); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="panel">
  <span class="tip">鼠标拖拽任一摆球设定初始角度，松手释放</span>
  <button id="resetBtn" type="button">重置初始状态</button>
</div>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');

  // ===== 双摆物理参数（SI 单位，1m = 100px）=====
  var PX_PER_M = 100;
  var m1 = 1.2, m2 = 1.0;          // 质量 kg
  var L1 = 1.6, L2 = 1.4;          // 摆长 m（160px / 140px）
  var G = 9.8;
  var INIT = [Math.PI / 2, 0, Math.PI / 2 + 0.001, 0]; // 近水平释放→混沌
  var s = INIT.slice();            // 状态 [θ1, ω1, θ2, ω2]

  // ===== RK4 求解拉格朗日二阶微分方程组 =====
  function deriv(y) {
    var t1 = y[0], w1 = y[1], t2 = y[2], w2 = y[3];
    var d = t1 - t2;
    var den = 2 * m1 + m2 - m2 * Math.cos(2 * d);
    var a1 = (-G * (2 * m1 + m2) * Math.sin(t1)
              - m2 * G * Math.sin(t1 - 2 * t2)
              - 2 * Math.sin(d) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d)))
             / (L1 * den);
    var a2 = (2 * Math.sin(d) * (w1 * w1 * L1 * (m1 + m2)
              + G * (m1 + m2) * Math.cos(t1)
              + w2 * w2 * L2 * m2 * Math.cos(d)))
             / (L2 * den);
    return [w1, a1, w2, a2];
  }

  function scaled(y, k, h) {
    return [y[0] + k[0] * h, y[1] + k[1] * h, y[2] + k[2] * h, y[3] + k[3] * h];
  }

  function rk4Step(y, h) {
    var k1 = deriv(y);
    var k2 = deriv(scaled(y, k1, h / 2));
    var k3 = deriv(scaled(y, k2, h / 2));
    var k4 = deriv(scaled(y, k3, h));
    return [
      y[0] + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
      y[1] + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
      y[2] + h / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]),
      y[3] + h / 6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3])
    ];
  }

  function energy(y) {                // 用于监控数值发散
    var t1 = y[0], w1 = y[1], t2 = y[2], w2 = y[3];
    var v1sq = L1 * L1 * w1 * w1;
    var v2sq = v1sq + L2 * L2 * w2 * w2 + 2 * L1 * L2 * w1 * w2 * Math.cos(t1 - t2);
    var T = 0.5 * m1 * v1sq + 0.5 * m2 * v2sq;
    var V = -(m1 + m2) * G * L1 * Math.cos(t1) - m2 * G * L2 * Math.cos(t2);
    return T + V;
  }

  // ===== 画布与 HiDPI =====
  var W = 0, H = 0;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function pivot() {
    return { x: W / 2, y: Math.max(60, H * 0.28) };
  }

  function positions() {
    var pv = pivot();
    var l1 = L1 * PX_PER_M, l2 = L2 * PX_PER_M;
    var x1 = pv.x + l1 * Math.sin(s[0]), y1 = pv.y + l1 * Math.cos(s[0]);
    return {
      pv: pv,
      b1: { x: x1, y: y1 },
      b2: { x: x1 + l2 * Math.sin(s[2]), y: y1 + l2 * Math.cos(s[2]) }
    };
  }

  // ===== 彩虹拖尾 =====
  var trail = [];
  var TRAIL_MAX = 260;

  // ===== 鼠标拖拽 =====
  var dragging = 0;                  // 0=无 1=摆球1 2=摆球2
  function hitTest(mx, my, p) {
    var d2 = function (a, b) { return (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y); };
    if (d2(p.b2, { x: mx, y: my }) < 28 * 28) return 2;
    if (d2(p.b1, { x: mx, y: my }) < 28 * 28) return 1;
    return 0;
  }
  canvas.addEventListener('mousedown', function (e) {
    var p = positions();
    dragging = hitTest(e.clientX, e.clientY, p);
    if (dragging) { s[1] = 0; s[3] = 0; trail.length = 0; }
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) {
      var p = positions();
      canvas.style.cursor = hitTest(e.clientX, e.clientY, p) ? 'grab' : 'default';
      return;
    }
    var pv = pivot();
    if (dragging === 1) {
      s[0] = Math.atan2(e.clientX - pv.x, e.clientY - pv.y);
    } else {
      var b1 = positions().b1;
      s[2] = Math.atan2(e.clientX - b1.x, e.clientY - b1.y);
    }
    s[1] = 0; s[3] = 0;
  });
  window.addEventListener('mouseup', function () { dragging = 0; });

  document.getElementById('resetBtn').addEventListener('click', function () {
    s = INIT.slice();
    trail.length = 0;
    E0 = energy(s);
  });

  // ===== 渲染 =====
  function drawGrid() {
    ctx.strokeStyle = 'rgba(90,130,200,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function drawBob(x, y, r, c1, c2) {
    var glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 3);
    glow.addColorStop(0, c1.replace('ALPHA', '0.5'));
    glow.addColorStop(1, c1.replace('ALPHA', '0'));
    ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2);
    ctx.fillStyle = glow; ctx.fill();

    var ball = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
    ball.addColorStop(0, c2);
    ball.addColorStop(1, c1.replace('ALPHA', '0.95'));
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = ball; ctx.fill();
  }

  function render(p) {
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    // 拖尾：半透明彩虹渐变衰减（叠加发光混合模式）
    if (p) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (var i = 1; i < trail.length; i++) {
        var a = i / trail.length;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = 'hsla(' + trail[i].hue + ',100%,60%,' + (0.5 * a * a).toFixed(3) + ')';
        ctx.lineWidth = 1 + 4 * a;
        ctx.stroke();
      }
      ctx.restore();
    }

    // 摆杆
    ctx.strokeStyle = '#8fa2c4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.pv.x, p.pv.y);
    ctx.lineTo(p.b1.x, p.b1.y);
    ctx.lineTo(p.b2.x, p.b2.y);
    ctx.stroke();

    // 悬点
    ctx.beginPath(); ctx.arc(p.pv.x, p.pv.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#3c4763'; ctx.fill();
    ctx.strokeStyle = '#6f86b8'; ctx.lineWidth = 1.5; ctx.stroke();

    drawBob(p.b1.x, p.b1.y, 16, 'rgba(90,184,255,ALPHA)', '#d8f2ff');
    drawBob(p.b2.x, p.b2.y, 14, 'rgba(255,140,220,ALPHA)', '#ffe9fb');
  }

  // ===== 主循环：固定物理步长 + RK4 子步 =====
  var lastT = null, E0 = energy(s), hue = 0;
  var H_STEP = 1 / 600;

  function loop(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.033);
    lastT = t;

    if (!dragging) {
      var n = Math.round(dt / H_STEP);
      for (var i = 0; i < n; i++) s = rk4Step(s, H_STEP);
    }

    var p = positions();
    if (!dragging) {
      hue = (hue + dt * 140) % 360;
      trail.push({ x: p.b2.x, y: p.b2.y, hue: Math.round(hue) });
      if (trail.length > TRAIL_MAX) trail.shift();
    }
    render(p);

    var drift = Math.abs(energy(s) - E0);
    hud.textContent =
      '双摆混沌模拟器 | RK4 h=' + (H_STEP * 1000).toFixed(1) + 'ms\n' +
      'θ1: ' + (s[0] * 180 / Math.PI).toFixed(1) + '°   θ2: ' + (s[2] * 180 / Math.PI).toFixed(1) + '°\n' +
      'ω1: ' + s[1].toFixed(2) + '  ω2: ' + s[3].toFixed(2) + ' rad/s\n' +
      '能量漂移: ' + drift.toExponential(1) + ' J  (数值稳定性)';

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
