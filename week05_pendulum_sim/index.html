<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆简谐振动模拟器 — Week05</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a24; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font: 13px/1.7 Consolas, "Courier New", monospace;
    color: #8fd3ff; text-shadow: 0 0 6px rgba(80,180,255,.45);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');

  // 物理参数：摆长 200px，g=9.8 m/s^2，初始摆角 45°
  var L = 200;
  var G = 9.8;
  var PX_PER_M = 100;            // 像素→米换算，L=200px 即 2m
  var L_m = L / PX_PER_M;
  var theta = 45 * Math.PI / 180; // 当前摆角
  var omega = 0;                  // 角速度
  var DAMPING = 0.0;              // 无阻尼，理想简谐
  var lastT = null;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function step(dt) {
    // 非线性摆方程 θ'' = -(g/L)·sinθ；小角度下即简谐振动
    var alpha = -(G / L_m) * Math.sin(theta) - DAMPING * omega;
    omega += alpha * dt;          // 半隐式欧拉，能量稳定
    theta += omega * dt;
  }

  function draw(pivotX, pivotY) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var bobX = pivotX + L * Math.sin(theta);
    var bobY = pivotY + L * Math.cos(theta);

    // 摆动轨迹弧
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, L, Math.PI / 2 - 0.85, Math.PI / 2 + 0.85);
    ctx.strokeStyle = 'rgba(120,160,220,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 摆线
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bobX, bobY);
    ctx.strokeStyle = '#9aa7c0';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 悬点
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#3c4763';
    ctx.fill();
    ctx.strokeStyle = '#6f86b8';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 摆球发光光效（外层辉光 + 内层高亮）
    var r = 18;
    var glow = ctx.createRadialGradient(bobX, bobY, r * 0.3, bobX, bobY, r * 3.2);
    glow.addColorStop(0, 'rgba(90,190,255,0.55)');
    glow.addColorStop(1, 'rgba(90,190,255,0)');
    ctx.beginPath();
    ctx.arc(bobX, bobY, r * 3.2, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    var ball = ctx.createRadialGradient(bobX - r * 0.35, bobY - r * 0.35, r * 0.15, bobX, bobY, r);
    ball.addColorStop(0, '#d8f2ff');
    ball.addColorStop(0.45, '#5ab8ff');
    ball.addColorStop(1, '#1f5f96');
    ctx.beginPath();
    ctx.arc(bobX, bobY, r, 0, Math.PI * 2);
    ctx.fillStyle = ball;
    ctx.fill();

    return bobX;
  }

  var period = 2 * Math.PI * Math.sqrt(L_m / G);

  function loop(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.033); // 限帧步长防跳变
    lastT = t;

    // 子步积分提高精度
    var sub = 4;
    for (var i = 0; i < sub; i++) step(dt / sub);

    var pivotX = canvas.width / 2;
    var pivotY = canvas.height * 0.18;
    draw(pivotX, pivotY);

    hud.textContent =
      '单摆模拟器 | L=200px(2m)  g=9.8m/s²  θ₀=45°\n' +
      '当前摆角: ' + (theta * 180 / Math.PI).toFixed(1) + '°\n' +
      '角速度:   ' + omega.toFixed(2) + ' rad/s\n' +
      '理论周期: ' + period.toFixed(2) + ' s';

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
